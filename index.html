<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mario Runner</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrapper">
    <div id="game-area">
      <canvas id="gameCanvas" width="800" height="560" tabindex="0" aria-label="Mario Runner game"></canvas>
    </div>
    <div id="sidebar">
      <div id="leaderboard-box">
        <div id="lb-title">TOP SCORES</div>
        <ol id="leaderboardList"><li>Loading...</li></ol>
      </div>
      <div id="controls-box">
        <div class="ctrl-title">CONTROLS</div>
        <div class="ctrl-visual">
          <div class="ctrl-block">
            <div class="key-row" aria-hidden="true">
              <kbd class="key-arrow">←</kbd>
              <kbd class="key-arrow">→</kbd>
            </div>
            <span class="ctrl-label">Move left / right</span>
          </div>
          <div class="ctrl-block">
            <div class="key-row" aria-hidden="true">
              <kbd class="kbd-space">Space</kbd>
            </div>
            <span class="ctrl-label">Jump</span>
            <span class="ctrl-sublabel">(or ↑ W)</span>
          </div>
          <div class="ctrl-block">
            <div class="key-row" aria-hidden="true">
              <kbd>A</kbd>
            </div>
            <span class="ctrl-label">Fireball</span>
            <span class="ctrl-sublabel">(after ? mushroom)</span>
          </div>
        </div>
        <div class="ctrl-hints">
          <div class="ctrl-hint-row"><span class="hint-ico">?</span> Bump from below</div>
          <div class="ctrl-hint-row"><span class="hint-ico">+</span> Stomp +200 · Coins +100</div>
          <div class="ctrl-hint-row"><span class="hint-ico hint-flag">Win</span> Reach flag</div>
          <div class="ctrl-hint-row ctrl-hint-pipe"><span class="hint-ico pipe-ico">&#9612;</span> Brown pipe + <kbd class="kbd-inline">S</kbd> / <kbd class="kbd-inline">&#9660;</kbd> underground bonus</div>
          <div class="ctrl-tester">Shift+G+O end run (save score)</div>
        </div>
      </div>
    </div>
  </div>
  <div id="touch-controls">
    <div class="touch-zone-left">
      <div class="touch-row">
        <div id="touch-left"  class="touch-btn">&#9664;</div>
        <div id="touch-right" class="touch-btn">&#9654;</div>
      </div>
      <div id="touch-down" class="touch-btn touch-down-btn" title="Pipe down">&#9660;</div>
    </div>
    <div class="touch-zone-right">
      <div id="touch-jump" class="touch-btn touch-jump-btn">&#9650;</div>
      <div id="touch-fire" class="touch-btn touch-fire-btn">&#9679;</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
